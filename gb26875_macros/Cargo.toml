[package]
name = "gb26875_macros"
version = "0.1.0"
edition = "2021"
authors = ["GB26875 Contributors"]
description = "Procedural macros for the GB26875 protocol library"
repository = "https://github.com/asmx1024/GB-T-26875.3.2011-rs"
license = "MIT OR Apache-2.0"
keywords = ["gb26875", "fire-safety", "protocol", "macros"]
categories = ["network-programming", "encoding", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
# 过程宏必需依赖
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }

# 工具依赖
once_cell = "1.19"

[dev-dependencies]
# 测试依赖
trybuild = "1.0"
