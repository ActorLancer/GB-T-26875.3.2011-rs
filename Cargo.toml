[package]
name = "gb26875"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Your Name <your.email@example.com>"]
description = "GB26875 城市消防远程监控系统通信协议的 Rust 实现"
documentation = "https://docs.rs/gb26875"
repository = "https://github.com/yourusername/gb26875"
license = "MIT OR Apache-2.0"
keywords = ["gb26875", "fire-alarm", "protocol", "iot", "monitoring"]
categories = ["encoding", "network-programming", "parser-implementations"]
readme = "README.md"

[dependencies]
# 核心依赖
bytes = "1"
thiserror = "1"
encoding_rs = "0.8"
once_cell = "1"

# 过程宏支持
gb26875_macros = { path = "gb26875_macros" }

# 日志 facade（只依赖接口）
log = "0.4"

# Serde 支持
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步支持
tokio = { version = "1", features = ["net", "io-util", "macros", "rt"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
# 测试
hex = "0.4"
tokio = { version = "1", features = ["full"] }
env_logger = "0.11"

# 基准测试
criterion = "0.5"

[[bin]]
name = "debug_packet"
path = "src/bin/debug_packet.rs"

[package.metadata.docs.rs]
# 设置文档中显示的目标平台
targets = ["x86_64-unknown-linux-gnu"]
